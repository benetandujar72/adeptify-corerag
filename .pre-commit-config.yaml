minimum_pre_commit_version: '3.5.0'
repos:
  - repo: local
    hooks:
      - id: adeptify-strict-secrets
        name: Credentials and identifiable data in tracked files
        entry: python backend/scripts/audita_secrets_repo.py --repo . --arbre --estricte --nomes-versionats
        language: system
        pass_filenames: false
        always_run: true
