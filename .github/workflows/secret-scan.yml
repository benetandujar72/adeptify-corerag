name: security-gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Strict tracked tree and reachable history scan
        run: python backend/scripts/audita_secrets_repo.py --repo . --estricte --nomes-versionats --informe secret-scan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secret-scan-metadata
          path: secret-scan.json
          retention-days: 7
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install packaging==26.2
      - name: Audit complete Linux CPU lock against OSV
        run: python backend/scripts/audita_dependencias_runtime.py --resolved-lock backend/requirements-linux-cpu.lock --output dependency-scan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-scan-public-metadata
          path: dependency-scan.json
          retention-days: 7
