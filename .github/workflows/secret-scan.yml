name: secret-scan

# Second layer of "zero leak": scans every push/PR (full history) for secrets.
# The first layer is the local pre-commit hook (.pre-commit-config.yaml).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to scan the whole git history, not just the diff

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only for orgs (not needed for a single public repo)
